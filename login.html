<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 농장 투약관리 시스템</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg?v=20260816a">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=20260816a">
<link rel="icon" href="img/favicon.ico?v=20260816a">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260816a">
<link rel="stylesheet" href="css/styles.css?v=20260816a">
</head>
<body style="display:block; height:auto; overflow:auto;">

<div class="login-wrap">
  <div class="login-card">
    <h1>🐔 농장 투약관리 시스템</h1>
    <div class="sub">직원 계정으로 로그인하세요</div>
    <div class="login-error" id="login-error"></div>
    <div class="form-group"><label>이메일</label><input id="login-email" type="email" placeholder="you@example.com" autocomplete="username"></div>
    <div class="form-group"><label>비밀번호</label><input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">로그인</button>
    <div class="text-muted mt-16" style="text-align:center">계정이 없으신가요? 관리자에게 문의해 발급받으세요.</div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260816a"></script>
<script src="js/supabaseClient.js?v=20260816a"></script>
<script src="js/auth.js?v=20260816a"></script>
<script>
(async function () {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { location.href = 'index.html'; return; }

  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  function showError(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
  function clearError() { errEl.classList.remove('show'); }

  async function attemptLogin() {
    clearError();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('이메일과 비밀번호를 입력하세요.'); return; }
    btn.disabled = true;
    try {
      await loginWithPassword(email, password);
      location.href = 'index.html';
    } catch (e) {
      showError('로그인 실패: 이메일 또는 비밀번호를 확인하세요.');
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', attemptLogin);
  document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
})();
</script>
</body>
</html>
