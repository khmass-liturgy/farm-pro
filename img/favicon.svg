  <circle cx="42" cy="130" r="9" fill="#7FA9C4" stroke="#3E6E8C" stroke-width="2"/>
  <circle cx="158" cy="130" r="9" fill="#7FA9C4" stroke="#3E6E8C" stroke-width="2"/>
  <circle cx="100" cy="179" r="12" fill="#8FB4CC" stroke="#3E6E8C" stroke-width="3"/>
  <circle cx="100" cy="179" r="5" fill="#3E6E8C"/>

  <!-- 육수(볏 아래 늘어진 부분) -->
  <ellipse cx="92" cy="140" rx="10" ry="13" fill="url(#wattleGrad)"/>
  <ellipse cx="108" cy="140" rx="10" ry="13" fill="url(#wattleGrad)"/>
</svg>
