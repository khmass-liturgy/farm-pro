<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="faceGrad" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="60%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#FCB900"/>
    </radialGradient>
    <radialGradient id="combGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="55%" stop-color="#FF2D1F"/>
      <stop offset="100%" stop-color="#D6180C"/>
    </radialGradient>
    <radialGradient id="wattleGrad" cx="35%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="60%" stop-color="#F4210F"/>
      <stop offset="100%" stop-color="#C81406"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8AA6"/>
      <stop offset="100%" stop-color="#3E6E8C"/>
    </linearGradient>
  </defs>

  <!-- 흰색 스티커 테두리 -->
  <path d="M100 22
    c 20 0 33 10 40 24
    c 26 3 50 20 58 46
    c 7 3 14 10 14 20
    c 0 11 -9 19 -18 20
    c -2 22 -18 40 -40 47
    c -8 9 -20 15 -54 15
    c -34 0 -46 -6 -54 -15
    c -22 -7 -38 -25 -40 -47
    c -9 -1 -18 -9 -18 -20
    c 0 -10 7 -17 14 -20
    c 8 -26 32 -43 58 -46
    c 7 -14 20 -24 40 -24 Z"
    fill="#FFFFFF" opacity="0.95"/>

  <!-- 볼(귀) 돌기 -->
  <ellipse cx="38" cy="128" rx="20" ry="24" fill="url(#faceGrad)"/>
  <ellipse cx="162" cy="128" rx="20" ry="24" fill="url(#faceGrad)"/>

  <!-- 볏(맨위 빨간 볼록 3개) -->
  <circle cx="78" cy="58" r="26" fill="url(#combGrad)"/>
  <circle cx="100" cy="46" r="30" fill="url(#combGrad)"/>
  <circle cx="122" cy="58" r="26" fill="url(#combGrad)"/>
  <ellipse cx="70" cy="48" rx="7" ry="9" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="93" cy="35" rx="8" ry="10" fill="#FFFFFF" opacity="0.5"/>

  <!-- 얼굴 -->
  <path d="M100 62
    c 34 0 58 22 58 58
    c 0 34 -26 54 -58 54
    c -32 0 -58 -20 -58 -54
    c 0 -36 24 -58 58 -58 Z"
    fill="url(#faceGrad)"/>
  <!-- 아래쪽 그림자 라인 -->
  <path d="M46 132 c 4 26 26 40 54 40 c 28 0 50 -14 54 -40
    c -6 22 -28 34 -54 34 c -26 0 -48 -12 -54 -34 Z"
    fill="#F5A300" opacity="0.55"/>

  <!-- 볼터치 -->
  <ellipse cx="58" cy="118" rx="15" ry="10" fill="#FF9A2E" opacity="0.85"/>
  <ellipse cx="142" cy="118" rx="15" ry="10" fill="#FF9A2E" opacity="0.85"/>

  <!-- 눈 -->
  <ellipse cx="76" cy="100" rx="13" ry="15" fill="#2B1600"/>
  <ellipse cx="124" cy="100" rx="13" ry="15" fill="#2B1600"/>
  <circle cx="72" cy="93" r="4" fill="#FFFFFF"/>
  <circle cx="120" cy="93" r="4" fill="#FFFFFF"/>

  <!-- 부리 -->
  <path d="M100 104 L120 118 c 0 10 -9 17 -20 17 c -11 0 -20 -7 -20 -17 Z" fill="#6B3A12"/>
  <path d="M100 108 L115 119 c 0 7 -7 12 -15 12 c -8 0 -15 -5 -15 -12 Z" fill="url(#beakGrad)"/>
  <path d="M100 108 L108 114 L100 116 L92 114 Z" fill="#FFF3C4"/>

  <!-- 청진기 (컨설팅/왕진 상징) -->
  <path d="M42 132 C 40 158, 66 176, 100 176 C 134 176, 160 158, 158 132"
